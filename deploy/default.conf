# apertureshift.com - container nginx server config.
# Mounted over the nginx:alpine default server so the styled 404 page
# in the web root is the container's error page. Static files only;
# anything missing answers 404 with /404.html.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
